; =============================================================================
; Laravel Queue Worker - meem-imports  (long-running Excel/CSV bulk jobs)
; -----------------------------------------------------------------------------
; Jobs: ImportProductsJob, ExportProductsJob
; Spec: 1 worker, tries=2, timeout=1800, sleep=5, memory=1024
; Single worker: bulk imports are memory-heavy and must not run in parallel.
; =============================================================================
[program:laravel-worker-meem-imports]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html
command=/usr/local/bin/php /var/www/html/artisan queue:work redis --queue=meem-imports --tries=2 --timeout=1800 --sleep=5 --memory=1024 --max-jobs=1000 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=meemmarket
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-meem-imports.log
stopwaitsecs=1860
