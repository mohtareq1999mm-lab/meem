; =============================================================================
; Laravel Queue Worker - meem-high  (customer-facing, time-critical)
; -----------------------------------------------------------------------------
; Jobs: SendPasswordResetEmailJob, SendFrontendWebhookJob, GenerateInvoiceListener,
;       OneTimePasswordNotification
; Spec: 2 workers, tries=5, timeout=90, sleep=1, memory=256
; =============================================================================
[program:laravel-worker-meem-high]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html
command=/usr/local/bin/php /var/www/html/artisan queue:work redis --queue=meem-high --tries=5 --timeout=90 --sleep=1 --memory=256 --max-jobs=1000 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=meemmarket
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-meem-high.log
stopwaitsecs=120
