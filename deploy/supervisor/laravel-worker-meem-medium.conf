; =============================================================================
; Laravel Queue Worker - meem-medium  (background / long-running)
; -----------------------------------------------------------------------------
; Jobs: GenerateInvoicePdfJob, LogActivityJob, PaymentReconciliationJob,
;       all ShouldQueue listeners and notifications, imports/exports
; Spec: 1 worker, tries=3, timeout=900, sleep=3, memory=256 (conservative — scale only when needed)
; =============================================================================
[program:laravel-worker-meem-medium]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html
command=/usr/local/bin/php /var/www/html/artisan queue:work database --queue=meem-medium --tries=3 --timeout=900 --sleep=3 --memory=256 --max-jobs=1000 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-meem-medium.log
stopwaitsecs=960
